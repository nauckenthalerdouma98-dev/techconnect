<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Milestone Work - TechConnect</title>
    <link rel="stylesheet" href="../styles-shared.css">
    <link rel="stylesheet" href="review-milestone.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>TechConnect</h1>
            <p>Review and approve submitted work</p>
        </div>

        <!-- Navigation -->
        <div class="nav-tabs">
            <a href="../My jobs/my-jobs.html" class="nav-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Pending Offers">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                Pending Offers
            </a>
            <a href="../Send Offer/send-offer.html" class="nav-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Send Offer">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                    <polyline points="16 6 12 2 8 6"></polyline>
                    <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>
                Send Offer
            </a>
            <a href="../Submit milestone/submit-milestone.html" class="nav-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Submit Work">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <polyline points="19 12 12 19 5 12"></polyline>
                </svg>
                Submit Work
            </a>
            <a href="review-milestone.html" class="nav-btn active">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Review Work">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Review Work
            </a>
        </div>

        <!-- Main Content -->
        <div class="card">
            <h3>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Review Milestone">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Review Milestone
            </h3>

            <div class="revision-info">
                <p>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Revision Count">
                        <path d="M4 4v7a7 7 0 0 0 14 0V4m-7 0L8 8m3-4l3 4"></path>
                    </svg>
                    Revision Count: <span class="revision-count" id="revCount">0</span>/3
                </p>
                <p style="font-size: 0.9rem; color: #999; margin-top: 8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Info">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    Maximum 3 revision rounds allowed
                </p>
            </div>

            <form id="reviewForm">
                <div class="form-group">
                    <label for="comment">Review Comment</label>
                    <textarea id="comment" placeholder="Provide your feedback or specify required changes..."
                        required></textarea>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn btn-success" onclick="review('Approve')">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Approve">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="16 12 12 8 8 12"></polyline>
                        </svg>
                        Approve Work
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="review('Request Changes')">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-label="Request Changes">
                            <path d="M4 4v7a7 7 0 0 0 14 0V4m-7 0L8 8m3-4l3 4"></path>
                        </svg>
                        Request Changes
                    </button>
                </div>
            </form>

            <div class="success-message" id="reviewMessage">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-label="Success">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="16 12 12 8 8 12"
                        style="fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
                    </polyline>
                </svg>
                <span>Review submitted! The freelancer has been notified of your feedback.</span>
            </div>
        </div>
    </div>

    <script src="review-milestone.js"></script>
</body>

</html>
