<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Job Offer - TechConnect</title>
    <link rel="stylesheet" href="../styles-shared.css">
    <link rel="stylesheet" href="send-offer.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>TechConnect</h1>
            <p>Create and send professional project offers</p>
        </div>

        <!-- Navigation -->
        <div class="nav-tabs">
            <a href="../My jobs/my-jobs.html" class="nav-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Pending Offers">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                Pending Offers
            </a>
            <a href="send-offer.html" class="nav-btn active">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Send Offer">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                    <polyline points="16 6 12 2 8 6"></polyline>
                    <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>
                Send Offer
            </a>
            <a href="../Submit milestone/submit-milestone.html" class="nav-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Submit Work">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <polyline points="19 12 12 19 5 12"></polyline>
                </svg>
                Submit Work
            </a>
            <a href="../Review Milestone/review-milestone.html" class="nav-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Review Work">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Review Work
            </a>
        </div>

        <!-- Main Content -->
        <div class="card">
            <h3>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Send Offer">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                    <polyline points="16 6 12 2 8 6"></polyline>
                    <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>
                Send Job Offer
            </h3>
            <form id="offerForm">
                <div class="form-group">
                    <label for="jobSelect">Select Open Project</label>
                    <select id="jobSelect" required>
                        <option value="">-- Choose a Project --</option>
                        <option value="project1">Frontend Development</option>
                        <option value="project2">Backend API Design</option>
                        <option value="project3">Mobile App Development</option>
                        <option value="project4">UI/UX Design</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="offerPrice">Offer Price</label>
                    <input id="offerPrice" type="number" min="0" step="100" placeholder="Enter amount in FCFA" required>
                </div>

                <div class="form-group">
                    <label for="offerNote">Offer Message</label>
                    <textarea id="offerNote"
                        placeholder="Outline specific terms, deliverables, timeline or expectations..."
                        required></textarea>
                </div>

                <div class="info-box">
                    <p>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Budget">
                            <line x1="12" y1="1" x2="12" y2="23"></line>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                        <span class="label">Selected Project Budget:</span> <span id="budgetDisplay">0</span> FCFA
                    </p>
                    <p style="font-size: 0.85rem; color: #888; margin-top: 8px;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Security">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                        Funds will be securely held in escrow via Nkwa Pay.
                    </p>
                </div>

                <button type="submit" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Send">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                        <polyline points="16 6 12 2 8 6"></polyline>
                        <line x1="12" y1="2" x2="12" y2="15"></line>
                    </svg>
                    Send Formal Offer
                </button>
            </form>
            <div class="success-message" id="offerMessage">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-label="Success">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="16 12 12 8 8 12"
                        style="fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
                    </polyline>
                </svg>
                <span>Offer successfully sent! The freelancer has been notified and has 48 hours to respond.</span>
            </div>
        </div>
    </div>

    <script src="send-offer.js"></script>
</body>

</html>
