<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pending Offers - TechConnect</title>
    <link rel="stylesheet" href="../styles-shared.css">
    <link rel="stylesheet" href="my-jobs.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>TechConnect</h1>
            <p>Manage your pending project offers</p>
        </div>

        <!-- Navigation -->
        <div class="nav-tabs">
            <a href="my-jobs.html" class="nav-btn active">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Pending Offers">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                Pending Offers
            </a>
            <a href="../Send Offer/send-offer.html" class="nav-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Send Offer">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                    <polyline points="16 6 12 2 8 6"></polyline>
                    <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>
                Send Offer
            </a>
            <a href="../Submit milestone/submit-milestone.html" class="nav-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Submit Work">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <polyline points="19 12 12 19 5 12"></polyline>
                </svg>
                Submit Work
            </a>
            <a href="../Review Milestone/review-milestone.html" class="nav-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Review Work">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Review Work
            </a>
        </div>

        <!-- Main Content -->
        <div class="card">
            <h3>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="My Pending Offers">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                 Pending Offers
            </h3>
            <div id="offers">
                <div class="offer-card">
                    <h4>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Project">
                            <polyline points="12 3 20 7.5 20 16.5 12 21 4 16.5 4 7.5 12 3"></polyline>
                            <line x1="12" y1="12" x2="20" y2="7.5"></line>
                            <line x1="12" y1="12" x2="12" y2="21"></line>
                            <line x1="12" y1="12" x2="4" y2="7.5"></line>
                        </svg>
                        Frontend React Task
                    </h4>
                    <p>A modern React component development project</p>
                    <p class="budget-highlight">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Budget">
                            <line x1="12" y1="1" x2="12" y2="23"></line>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                        Budget: 50,000 FCFA
                    </p>
                    <p style="color: #999; font-size: 0.9rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Time">
                            <circle cx="12" cy="12" r="9"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        Expires in 48 hours
                    </p>
                    <div class="btn-group">
                        <button class="btn btn-success" onclick="acceptOffer()">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-label="Accept">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            Accept Offer
                        </button>
                        <button class="btn btn-secondary" onclick="declineOffer()">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-label="Decline">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                            Decline
                        </button>
                    </div>
                </div>
            </div>
            <div class="success-message" id="acceptMessage">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-label="Success">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="16 12 12 8 8 12"
                        style="fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
                    </polyline>
                </svg>
                <span>You have accepted the offer! You now have 48 hours to start the project.</span>
            </div>
        </div>
    </div>

    <script src="my-jobs.js"></script>
</body>

</html>
