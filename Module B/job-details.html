<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details · TechConnect</title>
    <style>
        :root {
            --deep-gray: #1E1E1E;
            --violet: #8E44AD;
            --violet-light: #A569BD;
            --violet-dark: #6C3483;
            --soft-white: #EAEAEA;
            --soft-white-muted: #F5F5F5;
            --card-bg: #FFFFFF;
            --border-subtle: #E5E5E5;
            --text-muted: #666666;
            --success: #27AE60;
            --warning: #F39C12;
            --error: #E74C3C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--soft-white);
            color: var(--deep-gray);
            line-height: 1.5;
        }

        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--violet);
            text-decoration: none;
        }

        .navbar-nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--violet);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--violet);
            text-decoration: none;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--violet-dark);
        }

        .dashboard-container {
            display: flex;
            min-height: calc(100vh - 65px);
        }

        .sidebar {
            width: 260px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-subtle);
            padding: 2rem 1rem;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 0.25rem;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background-color: var(--violet);
            color: white;
        }

        .sidebar-menu a:hover svg,
        .sidebar-menu a.active svg {
            stroke: white;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
        }

        .job-details-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            overflow: hidden;
        }

        .job-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .job-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--deep-gray);
            margin-bottom: 0.75rem;
        }

        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .budget-large {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--violet);
        }

        .level-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .level-beginner {
            background-color: rgba(39, 174, 96, 0.1);
            color: #27AE60;
        }

        .level-intermediate {
            background-color: rgba(243, 156, 18, 0.1);
            color: #F39C12;
        }

        .level-advanced {
            background-color: rgba(142, 68, 173, 0.1);
            color: var(--violet);
        }

        .job-section {
            padding: 2rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .job-section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--deep-gray);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .job-description {
            color: var(--text-muted);
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .skill-tag {
            background-color: rgba(142, 68, 173, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--violet);
            font-weight: 500;
        }

        .milestones-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .milestone-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background-color: var(--soft-white-muted);
            border-radius: 12px;
        }

        .milestone-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .milestone-name {
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--deep-gray);
        }

        .milestone-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .milestone-amount {
            font-weight: 600;
            color: var(--violet);
        }

        .client-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background-color: var(--soft-white-muted);
            border-radius: 12px;
        }

        .client-avatar {
            width: 48px;
            height: 48px;
            background-color: var(--violet-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .client-info h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .client-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0.25rem;
        }

        .apply-section {
            background-color: var(--soft-white-muted);
            text-align: center;
        }

        .btn-apply {
            background-color: var(--violet);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-apply:hover {
            background-color: var(--violet-dark);
            transform: translateY(-2px);
        }

        .error-state {
            text-align: center;
            padding: 4rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .job-header {
                padding: 1.5rem;
            }
            .job-section {
                padding: 1.5rem;
            }
            .job-title {
                font-size: 1.25rem;
            }
            .milestone-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="dashboard.html" class="navbar-brand">TechConnect</a>
    <div class="navbar-nav">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="post-job.html" class="nav-link">Post a Job</a>
        <a href="#" class="nav-link">Profile</a>
        <a href="#" class="nav-link">Sign out</a>
    </div>
</nav>

<div class="dashboard-container">
    <aside class="sidebar">
        <ul class="sidebar-menu">
            <li>
                <a href="dashboard.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Find Work">
                        <path d="M20 7h-4.18A3 3 0 0 0 16 5.18V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v1.18A3 3 0 0 0 8.18 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"/>
                        <circle cx="12" cy="13" r="3"/>
                    </svg>
                    Find Work
                </a>
            </li>
            <li>
                <a href="post-job.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Post a Job">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Post a Job
                </a>
            </li>
            <li>
                <a href="#" class="active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Job Details">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                    </svg>
                    Job Details
                </a>
            </li>
        </ul>
    </aside>

    <main class="main-content" id="mainContent">
        <!-- Content will be loaded here by JavaScript -->
        <div class="error-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" style="margin-bottom: 1rem;">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <p>Loading job details...</p>
        </div>
    </main>
</div>

<script>
    (function() {
        // Complete job database (same as dashboard)
        var allJobsData = [
            {
                id: "job_001",
                title: "Data Entry Clerk",
                description: "Enter customer data into Excel spreadsheet. Simple copy-paste work. No experience needed. Training provided. You will be working with our customer database, ensuring all information is accurate and up to date. This is a remote position with flexible hours.",
                budget: 25000,
                deadline: "2024-12-20",
                requiredSkills: ["Typing", "Data Entry", "Microsoft Excel"],
                level: "beginner",
                status: "Created",
                createdAt: "2024-12-08T09:00:00Z",
                clientName: "John Smith",
                clientRating: 4.8,
                clientJobs: 24,
                milestones: [
                    { name: "Initial Data Entry", description: "Enter first 500 records", amount: 10000 },
                    { name: "Verification", description: "Verify and correct entries", amount: 8000 },
                    { name: "Final Submission", description: "Complete remaining records", amount: 7000 }
                ]
            },
            {
                id: "job_002",
                title: "Typing Job - Document Transcription",
                description: "Convert handwritten notes to typed Word documents. Need 40 WPM typing speed. The documents are clear and easy to read. You will receive 10 documents per week.",
                budget: 15000,
                deadline: "2024-12-18",
                requiredSkills: ["Typing", "Microsoft Word"],
                level: "beginner",
                status: "Created",
                createdAt: "2024-12-08T10:30:00Z",
                clientName: "Sarah Johnson",
                clientRating: 4.9,
                clientJobs: 56,
                milestones: [
                    { name: "First Batch", description: "Transcribe 5 documents", amount: 7500 },
                    { name: "Final Batch", description: "Transcribe remaining 5 documents", amount: 7500 }
                ]
            },
            {
                id: "job_008",
                title: "E-commerce Website Development",
                description: "Build a full e-commerce store with product catalog, shopping cart, and payment integration. We need a fully functional website with admin panel, product management, and order tracking system.",
                budget: 350000,
                deadline: "2025-01-15",
                requiredSkills: ["JavaScript", "React", "Node.js"],
                level: "advanced",
                status: "Created",
                createdAt: "2024-12-03T10:00:00Z",
                clientName: "Michael Chen",
                clientRating: 4.7,
                clientJobs: 89,
                milestones: [
                    { name: "Project Setup", description: "Set up development environment and database", amount: 50000 },
                    { name: "Frontend Development", description: "Build React components and pages", amount: 120000 },
                    { name: "Backend API", description: "Create RESTful API and payment integration", amount: 100000 },
                    { name: "Testing & Deployment", description: "QA testing and production deployment", amount: 80000 }
                ]
            }
        ];

        function getLevelText(level) {
            if (level === 'beginner') return 'Beginner';
            if (level === 'intermediate') return 'Intermediate';
            return 'Advanced';
        }

        function getLevelClass(level) {
            if (level === 'beginner') return 'level-beginner';
            if (level === 'intermediate') return 'level-intermediate';
            return 'level-advanced';
        }

        function formatCurrency(amount) {
            return amount.toLocaleString() + ' FCFA';
        }

        function formatDate(dateString) {
            var date = new Date(dateString);
            var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return months[date.getMonth()] + ' ' + date.getDate() + ', ' + date.getFullYear();
        }

        function getJobFromUrl() {
            var urlParams = new URLSearchParams(window.location.search);
            var jobId = urlParams.get('id');
            if (!jobId) return null;
            for (var i = 0; i < allJobsData.length; i++) {
                if (allJobsData[i].id === jobId) {
                    return allJobsData[i];
                }
            }
            return null;
        }

        function renderJobDetails() {
            var job = getJobFromUrl();
            var container = document.getElementById('mainContent');
            
            if (!job) {
                container.innerHTML = 
                    '<div class="error-state">' +
                        '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--error)" stroke-width="2" style="margin-bottom: 1rem;">' +
                            '<circle cx="12" cy="12" r="10"/>' +
                            '<line x1="12" y1="8" x2="12" y2="12"/>' +
                            '<line x1="12" y1="16" x2="12.01" y2="16"/>' +
                        '</svg>' +
                        '<p>Job not found</p>' +
                        '<a href="dashboard.html" class="back-link" style="margin-top: 1rem; justify-content: center;">' +
                            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                                '<line x1="19" y1="12" x2="5" y2="12"/>' +
                                '<polyline points="12 19 5 12 12 5"/>' +
                            '</svg>' +
                            'Back to Dashboard' +
                        '</a>' +
                    '</div>';
                return;
            }
            
            var skillsHtml = '';
            for (var s = 0; s < job.requiredSkills.length; s++) {
                skillsHtml += '<span class="skill-tag">' + job.requiredSkills[s] + '</span>';
            }
            
            var milestonesHtml = '';
            if (job.milestones && job.milestones.length > 0) {
                for (var m = 0; m < job.milestones.length; m++) {
                    var milestone = job.milestones[m];
                    milestonesHtml += 
                        '<div class="milestone-item">' +
                            '<div class="milestone-info">' +
                                '<span class="milestone-name">' + milestone.name + '</span>' +
                                '<span class="milestone-desc">' + milestone.description + '</span>' +
                            '</div>' +
                            '<span class="milestone-amount">' + formatCurrency(milestone.amount) + '</span>' +
                        '</div>';
                }
            }
            
            var starsHtml = '';
            var fullStars = Math.floor(job.clientRating);
            for (var i = 0; i < fullStars; i++) {
                starsHtml += '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="var(--warning)" style="color: var(--warning);"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
            }
            if (job.clientRating % 1 >= 0.5) {
                starsHtml += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2" style="color: var(--warning);"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
            }
            
            var html = 
                '<div class="job-details-card">' +
                    '<div class="job-header">' +
                        '<a href="dashboard.html" class="back-link">' +
                            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                                '<line x1="19" y1="12" x2="5" y2="12"/>' +
                                '<polyline points="12 19 5 12 12 5"/>' +
                            '</svg>' +
                            'Back to Dashboard' +
                        '</a>' +
                        '<h1 class="job-title">' + job.title + '</h1>' +
                        '<div class="job-meta">' +
                            '<span class="meta-item">' +
                                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"stroke-width="2">' +
                                    '<line x1="12" y1="1" x2="12" y2="23"/>' +
                                    '<path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' +
                                '</svg>' +
                                '<span class="budget-large">' + formatCurrency(job.budget) + '</span>' +
                            '</span>' +
                            '<span class="meta-item">' +
                                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                                    '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>' +
                                    '<line x1="16" y1="2" x2="16" y2="6"/>' +
                                    '<line x1="8" y1="2" x2="8" y2="6"/>' +
                                    '<line x1="3" y1="10" x2="21" y2="10"/>' +
                                '</svg>' +
                                'Deadline: ' + formatDate(job.deadline) +
                            '</span>' +
                            '<span class="meta-item">' +
                                '<span class="level-badge ' + getLevelClass(job.level) + '">' + getLevelText(job.level) + '</span>' +
                            '</span>' +
                        '</div>' +
                    '</div>' +
                    
                    '<div class="job-section">' +
                        '<div class="section-title">' +
                            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                                '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>' +
                                '<path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>' +
                            '</svg>' +
                            'Job Description' +
                        '</div>' +
                        '<p class="job-description">' + job.description + '</p>' +
                    '</div>' +
                    
                    '<div class="job-section">' +
                        '<div class="section-title">' +
                            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                                '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>' +
                            '</svg>' +
                            'Required Skills' +
                        '</div>' +
                        '<div class="skills-list">' + skillsHtml + '</div>' +
                    '</div>' +
                    
                    '<div class="job-section">' +
                        '<div class="section-title">' +
                            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                                '<line x1="12" y1="2" x2="12" y2="6"/>' +
                                '<line x1="12" y1="18" x2="12" y2="22"/>' +
                                '<line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/>' +
                                '<line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>' +
                                '<line x1="2" y1="12" x2="6" y2="12"/>' +
                                '<line x1="18" y1="12" x2="22" y2="12"/>' +
                                '<line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/>' +
                                '<line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>' +
                            '</svg>' +
                            'Milestones' +
                        '</div>' +
                        '<div class="milestones-list">' + milestonesHtml + '</div>' +
                    '</div>' +
                    
                    '<div class="job-section">' +
                        '<div class="section-title">' +
                            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                                '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>' +
                                '<circle cx="12" cy="7" r="4"/>' +
                            '</svg>' +
                            'About the Client' +
                        '</div>' +
                        '<div class="client-card">' +
                            '<div class="client-avatar">' +
                                '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">' +
                                    '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>' +
                                    '<circle cx="12" cy="7" r="4"/>' +
                                '</svg>' +
                            '</div>' +
                            '<div class="client-info">' +
                                '<h4>' + job.clientName + '</h4>' +
                                '<p>' + job.clientJobs + ' jobs posted</p>' +
                                '<div class="rating">' + starsHtml + '<span style="margin-left: 0.25rem;">' + job.clientRating + '</span></div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    
                    '<div class="job-section apply-section">' +
                        '<button class="btn-apply" onclick="window.applyForJob()">' +
                            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">' +
                                '<line x1="22" y1="2" x2="11" y2="13"/>' +
                                '<polygon points="22 2 15 22 11 13 2 9 22 2"/>' +
                            '</svg>' +
                            'Apply for this job' +
                        '</button>' +
                        '<p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 1rem;">Your application will be sent to the client. You will be notified when they respond.</p>' +
                    '</div>' +
                '</div>';
            
            container.innerHTML = html;
        }
        
        window.applyForJob = function() {
            var job = getJobFromUrl();
            if (job) {
                alert('Application submitted for: ' + job.title + '\n\nThe client will review your profile and contact you if selected.\n\n(Full application system coming in next iteration)');
            }
        };
        
        document.addEventListener('DOMContentLoaded', function() {
            renderJobDetails();
        });
    })();
</script>
