<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback & Rating</title>

  <link rel="stylesheet" href="feedback.css">

  
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

</head>
<body>

  <div class="container">

    
    <div class="header">
      <h1>Feedback & Ratings</h1>
      <p>Rate your completed project experience</p>
    </div>

    <div class="feedback-card">

      
      <div class="user-info">

        <img src="images\img1.jfif">

        <div>
          <h2>Princess Victoy</h2>
          <p>Frontend Developer</p>
        </div>

      </div>

      
      <div class="rating-section">

        <h3>Rate This User</h3>

        <div class="stars">

          <i class="fa-regular fa-star star" data-value="1"></i>
          <i class="fa-regular fa-star star" data-value="2"></i>
          <i class="fa-regular fa-star star" data-value="3"></i>
          <i class="fa-regular fa-star star" data-value="4"></i>
          <i class="fa-regular fa-star star" data-value="5"></i>

        </div>

        <p id="ratingText">Select Rating</p>

      </div>

      
      <div class="comment-section">

        <h3>Write Feedback</h3>

        <textarea
        id="comment"
        placeholder="Write your feedback here..."></textarea>

      </div>

      
      <button id="submitBtn">
        Submit Feedback
      </button>

    </div>

    
    <div class="reviews-section">

      <h2>Recent Reviews</h2>

      <div class="review-box">

        <div class="review-top">

          <img src="images\img3.jfif">
         
          <div>
            <h3>Ambang sucess</h3>
            <p>★★★★★</p>
          </div>

        </div>

        <p>
          Excellent work and communication.
          Delivered everything on time.
        </p>

      </div>

      <div class="review-box">

        <div class="review-top">

          <img src="images\img2.jfif">

          <div>
            <h3>Amabo Favour</h3>
            <p>★★★★☆</p>
          </div>

        </div>

        <p>
          Great developer skills.
        </p>

      </div>

    </div>

  </div>

  <script src="feedback.js"></script>

</body>
</html>
