<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Profile – TechConnect</title>
    <meta name="description" content="Edit your TechConnect profile." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="profile.css" />
</head>

<body>
    <div class="notification-container" id="notificationContainer"></div>
    <div class="loading-bar" id="loadingBar">
        <div class="loading-bar__spinner"></div>
        <span>Processing…</span>
    </div>

    <main class="profile-page">
        <div class="profile-card">
            <!-- Header & Avatar -->
            <div class="role-badge" id="roleBadge">
                <span id="roleLabel">You are logged in as <strong>Skilled</strong></span>
                <a href="#" class="sign-out-link" id="signOutLink">Sign out</a>
            </div>
            <section class="card-header">
                <div class="avatar-wrapper">
                    <div class="avatar" id="avatarPreview">
                        <img id="avatarImg" src="" alt="Profile picture" />
                    </div>
                    <label class="avatar-upload" aria-label="Change profile picture">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" x2="12" y1="15" y2="3" />
                        </svg>
                        <input type="file" id="profilePictureInput" accept="image/*" hidden />
                    </label>
                </div>
                <h2 id="displayName" class="user-name">Your Name</h2>
                <p id="displayEmail" class="user-email">email@example.com</p>
                <hr class="divider-line" />
            </section>

            <!-- Editable Fields -->
            <form id="profileForm" class="card-body" novalidate>
                <div class="field">
                    <label for="fullName">Full name</label>
                    <input type="text" id="fullName" placeholder="Your full name" autocomplete="name" required />
                </div>

                <div class="field">
                    <label for="mobile">Mobile number</label>
                    <input type="tel" id="mobile" placeholder="+237 6XX XXX XXX" />
                </div>

                <div class="field">
                    <label for="education">Education</label>
                    <input type="text" id="education" placeholder="e.g. BSc Computer Science" />
                </div>

                <div class="row-fields">
                    <div class="field half">
                        <label for="country">Country</label>
                        <input type="text" id="country" placeholder="Cameroon" />
                    </div>
                    <div class="field half">
                        <label for="state">State / Region</label>
                        <input type="text" id="state" placeholder="Centre" />
                    </div>
                </div>

                <div class="field">
                    <label for="address1">Address line 1</label>
                    <input type="text" id="address1" placeholder="Street, district" />
                </div>
                <div class="field">
                    <label for="address2">Address line 2 (optional)</label>
                    <input type="text" id="address2" placeholder="Apartment, suite, etc." />
                </div>

                <!-- Role‑specific field: bio (always visible) -->
                <div class="field">
                    <label for="bio">Short bio</label>
                    <textarea id="bio" rows="3" placeholder="Tell others about your expertise or needs"></textarea>
                </div>

                <!-- Freelancer only: skill selector -->
                <div class="field freelancer-only" id="skillsField">
                    <label>Skills</label>
                    <div class="skill-selector">
                        <div class="skills-display" id="skillsDisplay"></div>
                        <input type="text" id="skillInput" placeholder="Add a skill (e.g. Python)" autocomplete="off" />
                        <div class="skill-suggestions" id="skillSuggestions"></div>
                    </div>
                </div>

                <!-- Freelancer only: experience -->
                <div class="field freelancer-only" id="experienceField">
                    <label for="experience">Experience in designing / development</label>
                    <textarea id="experience" rows="3" placeholder="Describe your relevant experience"></textarea>
                </div>

                <!-- Client only: company and typical projects (alternative to experience) -->
                <div class="field client-only hidden" id="clientCompanyField">
                    <label for="companyName">Company or organisation</label>
                    <input type="text" id="companyName" placeholder="Your company (optional)" />
                </div>
                <div class="field client-only hidden" id="clientDescField">
                    <label for="clientDesc">Typical projects you hire for</label>
                    <textarea id="clientDesc" rows="3" placeholder="Describe the type of work you need"></textarea>
                </div>

                <button type="submit" class="validate-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                    Save profile
                </button>
            </form>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="profile.js"></script>
</body>

</html>
