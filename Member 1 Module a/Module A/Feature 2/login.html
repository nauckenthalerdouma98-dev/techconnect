<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – TechConnect</title>
  <meta name="description" content="Log into your TechConnect account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="notification-container" id="notificationContainer"></div>

  <div class="auth-container">
    <div class="split-wrapper">
      <div class="form-side">
        <div class="form-content">
          <div class="back-link">
            <a href="../../Index/index.html">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              Back home
            </a>
          </div>
          <h2>Welcome back</h2>
          <p class="form-sub">Please enter your details to sign in.</p>

          <form id="loginForm" novalidate>
            <div class="field">
              <label for="loginEmail">Email address</label>
              <input type="email" id="loginEmail" placeholder="name@example.com" required autocomplete="email" />
            </div>
            <div class="field">
              <label for="loginPassword">Password</label>
              <div class="password-wrapper">
                <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
                <button type="button" class="toggle-password" aria-label="Show password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="options">
              <label class="remember">
                <input type="checkbox" /> Remember for 30 days
              </label>
              <a href="reset-password.html">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn--accent" id="loginBtn">
              <span class="btn-text">Sign in</span>
              <span class="spinner" hidden></span>
            </button>
            <div class="divider"><span>or</span></div>
            <button type="button" class="btn btn--outline" id="googleLoginBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.2 3.8C16.6 2.4 14.5 1.5 12 1.5 6.5 1.5 2 6 2 11.5S6.5 21.5 12 21.5c2.9 0 5.5-1.1 7.5-3.1l-2.9-2.2c-.8.7-1.9 1.1-3.1 1.1-2.5 0-4.5-2-4.5-4.5s2-4.5 4.5-4.5c1.2 0 2.4.5 3.3 1.4l-1.3 1.3h4.1V6.2c-1.2-1-2.6-2.4-4.4-2.4z"/></svg>
              Sign in with Google
            </button>
          </form>
        </div>
      </div>

      <div class="illustration-side">
        <div class="illustration-content">
          <svg width="200" height="180" viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="100" cy="100" r="70" fill="none" stroke="var(--violet)" stroke-width="2" stroke-dasharray="8 8"/>
            <rect x="85" y="70" width="30" height="40" rx="8" fill="var(--soft-white)" opacity="0.9"/>
            <circle cx="100" cy="80" r="5" fill="var(--violet)"/>
            <path d="M95 100 L105 100 M95 105 L105 105" stroke="var(--violet)" stroke-width="2" stroke-linecap="round"/>
            <path d="M130 80 Q140 60 155 65" stroke="var(--soft-white)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="160" cy="65" r="6" fill="var(--violet)"/>
            <path d="M70 120 Q50 130 45 115" stroke="var(--soft-white)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="40" cy="115" r="6" fill="var(--violet)"/>
            <circle cx="60" cy="80" r="4" fill="var(--soft-white)"/>
            <circle cx="140" cy="110" r="4" fill="var(--soft-white)"/>
          </svg>
          <h1>Your workspace awaits</h1>
          <p>Manage projects, track milestones, and communicate securely.</p>
        </div>
      </div>
    </div>

    <p class="auth-footer">
      Don't have an account? <a href="../Feature 1/register.html">Sign up</a>
    </p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="login.js"></script>
</body>
</html>
