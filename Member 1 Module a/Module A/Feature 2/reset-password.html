<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – TechConnect</title>
  <style>
    :root { --deep-gray: #1E1E1E; --violet: #8E44AD; --soft-white: #EAEAEA; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--soft-white);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 2rem;
    }
    .reset-container {
      width: 100%; max-width: 480px;
      background: #fff; border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
      padding: 2.5rem 2rem; text-align: center;
    }
    h2 {
      font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--deep-gray);
    }
    p { color: #666; margin-bottom: 1.5rem; font-size: 0.95rem; }
    input {
      width: 100%; padding: 0.85rem 1rem; border: 1px solid #ddd;
      border-radius: 12px; font-family: inherit; font-size: 0.95rem;
      margin-bottom: 1.2rem;
    }
    input:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(142,68,173,0.15); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      width: 100%; padding: 0.9rem; border-radius: 999px; font-weight: 600;
      font-size: 0.95rem; cursor: pointer; border: none;
      background: var(--violet); color: #fff; transition: background 0.25s;
    }
    .btn:hover { background: #7a39a0; }
    .back-link { margin-top: 1.5rem; font-size: 0.9rem; }
    .back-link a { color: var(--violet); font-weight: 600; }
    .message { margin-top: 1rem; font-size: 0.9rem; min-height: 1.5em; }
  </style>
</head>
<body>
  <div class="reset-container">
    <h2>Forgot your password?</h2>
    <p>Enter your email address and we’ll send you a link to reset your password.</p>
    <input type="email" id="resetEmail" placeholder="name@example.com" autocomplete="email" />
    <button id="sendResetBtn" class="btn">Send reset link</button>
    <div id="message" class="message"></div>
    <div class="back-link"><a href="login.html">← Back to login</a></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyC0vvCEOAsPIevk6O0C9DgyigFLSlbvCSI",
      authDomain: "techconnect-e09b5.firebaseapp.com",
      projectId: "techconnect-e09b5",
      storageBucket: "techconnect-e09b5.firebasestorage.app",
      messagingSenderId: "768554488751",
      appId: "1:768554488751:web:7d0d56461ee1b9a1e2d55a"
    });
    const auth = firebase.auth();

    document.getElementById('sendResetBtn').addEventListener('click', () => {
      const email = document.getElementById('resetEmail').value.trim();
      const msg = document.getElementById('message');
      if (!email) {
        msg.textContent = 'Please enter your email.';
        msg.style.color = '#e74c3c';
        return;
      }
      auth.sendPasswordResetEmail(email)
        .then(() => {
          msg.textContent = 'Password reset email sent! Check your inbox.';
          msg.style.color = '#2ecc71';
        })
        .catch(error => {
          msg.textContent = error.message;
          msg.style.color = '#e74c3c';
        });
    });
  </script>
</body>
</html>
