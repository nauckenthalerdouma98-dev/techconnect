<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Milestone · TechConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Same DDS styles as previous */
        :root {
            --deep-gray: #1E1E1E;
            --violet: #8E44AD;
            --violet-dark: #6C3483;
            --soft-white: #EAEAEA;
            --soft-white-muted: #F5F5F5;
            --card-bg: #FFFFFF;
            --border-subtle: #E5E5E5;
            --text-muted: #666666;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--soft-white);
            color: var(--deep-gray);
            line-height: 1.5;
        }
        h1, h2, h3, h4 { font-family: 'Syne', sans-serif; }
        .notification-container {
            position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%);
            z-index: 9999; width: 90%; max-width: 400px;
        }
        .notification {
            padding: 1rem; border-radius: 12px; color: #fff; margin-bottom: 0.5rem;
            animation: slideIn 0.3s forwards;
        }
        .notification.success { background:#2ecc71; }
        .notification.error { background:#e74c3c; }
        .notification.info { background: var(--violet); }
        @keyframes slideIn { from { opacity:0; transform:translateY(-30px); } to { opacity:1; transform:translateY(0); } }
        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .navbar-brand { font-size: 1.5rem; font-weight: 700; color: var(--violet); text-decoration: none; }
        .navbar-nav { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
        .nav-link { color: var(--text-muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; transition: color 0.2s; }
        .nav-link:hover { color: var(--violet); }

        .dashboard-container { display: flex; min-height: calc(100vh - 65px); }
        .sidebar {
            width: 260px; background-color: var(--card-bg); border-right: 1px solid var(--border-subtle);
            padding: 2rem 1rem;
        }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 0.25rem; }
        .sidebar-menu a {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
            color: var(--text-muted); text-decoration: none; border-radius: 8px; font-size: 0.875rem;
            transition: all 0.2s;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active { background-color: var(--violet); color: white; }
        /* For brevity, we reuse the same layout as send-offer – I'll include only essential new styles */
        .form-card { background:var(--card-bg); border:1px solid var(--border-subtle); border-radius:20px; padding:2rem; max-width:800px; margin:0 auto; }
        .form-group { margin-bottom:1.5rem; }
        .form-group label { display:block; margin-bottom:0.5rem; font-weight:500; }
        .form-group input, .form-group textarea, .form-group select {
            width:100%; padding:0.75rem; background:var(--soft-white-muted); border:1px solid var(--border-subtle); border-radius:12px; font-family:inherit;
        }
        .btn-primary { background:var(--violet); color:white; border:none; padding:0.75rem 1.5rem; border-radius:12px; cursor:pointer; }
        .btn-primary:hover { background:var(--violet-dark); }
        .btn-outline { background:transparent; border:1px solid var(--border-subtle); padding:0.75rem 1.5rem; border-radius:12px; cursor:pointer; }
        .form-actions { display:flex; gap:1rem; justify-content:flex-end; margin-top:2rem; }
    </style>
</head>
<body>
    <div class="notification-container" id="notificationContainer"></div>
    <nav class="navbar"><a href="../Module%202/home.html" class="navbar-brand">TechConnect</a><div class="navbar-nav" id="navbarNav"></div></nav>
    <div class="dashboard-container">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="../Module%202/home.html">Home</a></li>
                <li><a href="../Module%202/dashboard.html">Browse Jobs</a></li>
                <li><a href="../Module%202/post-job.html">Post a Job</a></li>
                <li><a href="../Module%201/Feature%203%20-%20Profile.html">My Profile</a></li>
                <li><a href="../Module%202/job-details.html">Job Details</a></li>
                <li><a href="../Module%203/my-jobs.html">Pending Offers</a></li>
                <li><a href="send-offer.html">Send Offer</a></li>
                <li><a href="submit-milestone.html" class="active">Submit Work</a></li>
                <li><a href="review-milestone.html">Review Work</a></li>
                <li><a href="#" id="signOutSidebar">Sign out</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="form-card">
                <h2>Submit Milestone Work</h2>
                <form id="submitForm">
                    <div class="form-group">
                        <label>Select Accepted Job</label>
                        <select id="jobSelect" required></select>
                    </div>
                    <div class="form-group">
                        <label>Milestone</label>
                        <select id="milestoneSelect" required></select>
                    </div>
                    <div class="form-group">
                        <label>Work Description</label>
                        <textarea id="description" rows="4" placeholder="Describe what you completed..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Attach File (optional)</label>
                        <input type="file" id="fileAttachment">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-outline" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn-primary">Submit for Review</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
<script>
    function showNotification(msg, type) {
        const container = document.getElementById('notificationContainer');
        if (!container) return;
        const notif = document.createElement('div');
        notif.className = `notification ${type}`;
        notif.textContent = msg;
        container.appendChild(notif);
        setTimeout(() => {
            notif.classList.add('hide');
            notif.addEventListener('animationend', () => notif.remove());
        }, 4000);
    }

    function getCurrentUser() { return JSON.parse(localStorage.getItem('techconnect_current_user')); }
    function getJobs() { return JSON.parse(localStorage.getItem('techconnect_jobs')) || []; }
    function getOffers() { return JSON.parse(localStorage.getItem('techconnect_offers')) || []; }
    function getSubmissions() { return JSON.parse(localStorage.getItem('techconnect_milestone_submissions')) || []; }
    function saveSubmissions(sub) { localStorage.setItem('techconnect_milestone_submissions', JSON.stringify(sub)); }

    function loadAcceptedJobs() {
        const user = getCurrentUser();
        if (!user || user.role !== 'skilled') return;
        const offers = getOffers().filter(o => o.freelancerId === user.uid && o.status === 'accepted');
        const jobIds = offers.map(o => o.jobId);
        const jobs = getJobs().filter(j => jobIds.includes(j.id));
        const select = document.getElementById('jobSelect');
        select.innerHTML = '<option value="">-- Select a job --</option>';
        jobs.forEach(job => {
            const option = document.createElement('option');
            option.value = job.id;
            option.textContent = job.title;
            select.appendChild(option);
        });
        if (jobs.length === 0) select.innerHTML = '<option value="">No accepted jobs</option>';
    }

    function loadMilestones() {
        const jobId = document.getElementById('jobSelect').value;
        const milestoneSelect = document.getElementById('milestoneSelect');
        if (!jobId) {
            milestoneSelect.innerHTML = '<option value="">Select a job first</option>';
            return;
        }
        const jobs = getJobs();
        const job = jobs.find(j => j.id === jobId);
        if (!job || !job.milestones) {
            milestoneSelect.innerHTML = '<option value="">No milestones defined</option>';
            return;
        }
        const submissions = getSubmissions().filter(s => s.jobId === jobId);
        // Determine next milestone: find first not approved and not pending? Actually we need the first incomplete milestone.
        // For simplicity, find the smallest milestone index that is not approved.
        let nextMilestoneIndex = -1;
        for (let i = 0; i < job.milestones.length; i++) {
            const sub = submissions.find(s => s.milestoneIndex === i);
            if (!sub || sub.status === 'revision_requested') {
                nextMilestoneIndex = i;
                break;
            }
            if (sub.status === 'approved') continue;
            // If pending, we can't submit again until client reviews. So skip.
            if (sub.status === 'pending') {
                nextMilestoneIndex = -2; // means waiting
                break;
            }
        }
        if (nextMilestoneIndex === -2) {
            milestoneSelect.innerHTML = '<option value="">Waiting for client review on current milestone</option>';
            return;
        }
        if (nextMilestoneIndex === -1 || nextMilestoneIndex >= job.milestones.length) {
            milestoneSelect.innerHTML = '<option value="">All milestones completed</option>';
            return;
        }
        const nextMilestone = job.milestones[nextMilestoneIndex];
        milestoneSelect.innerHTML = `<option value="${nextMilestoneIndex}">${nextMilestone.description} (${nextMilestone.amount.toLocaleString()} FCFA)</option>`;
    }

    document.getElementById('jobSelect').addEventListener('change', loadMilestones);

    document.getElementById('submitForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const user = getCurrentUser();
        if (!user || user.role !== 'skilled') { showNotification('Unauthorized', 'error'); return; }
        const jobId = document.getElementById('jobSelect').value;
        const milestoneIdx = parseInt(document.getElementById('milestoneSelect').value);
        const description = document.getElementById('description').value.trim();
        if (!jobId || isNaN(milestoneIdx) || !description) {
            showNotification('Please fill all required fields', 'error');
            return;
        }
        const jobs = getJobs();
        const job = jobs.find(j => j.id === jobId);
        if (!job) return;
        const milestone = job.milestones[milestoneIdx];
        if (!milestone) return;
        const submissions = getSubmissions();
        // Check existing submission for this milestone
        const existing = submissions.find(s => s.jobId === jobId && s.milestoneIndex === milestoneIdx);
        if (existing && existing.status !== 'revision_requested') {
            showNotification('You have already submitted this milestone. Wait for client review.', 'error');
            return;
        }
        let newSubmission;
        if (existing && existing.status === 'revision_requested') {
            // Update existing submission with new content
            existing.description = description;
            existing.status = 'pending';
            existing.submittedAt = new Date().toISOString();
            existing.revisionCount = (existing.revisionCount || 0);
            newSubmission = existing;
            saveSubmissions(submissions);
        } else {
            newSubmission = {
                id: Date.now(),
                jobId, milestoneIndex: milestoneIdx,
                milestoneDescription: milestone.description,
                amount: milestone.amount,
                description: description,
                file: null,
                status: 'pending',
                revisionCount: 0,
                submittedAt: new Date().toISOString()
            };
            submissions.push(newSubmission);
            saveSubmissions(submissions);
        }
        showNotification('Milestone submitted! The client will review it.', 'success');
        document.getElementById('submitForm').reset();
        loadAcceptedJobs();
    });

    document.getElementById('cancelBtn').addEventListener('click', () => { if(confirm('Clear form?')) document.getElementById('submitForm').reset(); });

    function init() {
        const user = getCurrentUser();
        if (!user) { window.location.href = '../Module%201/Feature%202%20-%20Login.html'; return; }
        if (user.role !== 'skilled') { document.querySelector('.main-content').innerHTML = '<div class="form-card"><p>Only freelancers can submit milestones.</p></div>'; return; }
        // navbar setup (same as your original, omitted for brevity)
        loadAcceptedJobs();
    }
    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
