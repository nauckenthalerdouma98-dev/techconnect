<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – TechConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --deep-gray: #1E1E1E;
      --violet: #8E44AD;
      --soft-white: #EAEAEA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--soft-white);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .reset-container {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
      padding: 2.5rem 2rem;
      text-align: center;
    }

    h2 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: var(--deep-gray);
    }

    p {
      color: #666;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
    }

    input:focus {
      outline: none;
      border-color: var(--violet);
      box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.9rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      background: var(--violet);
      color: #fff;
      transition: background 0.25s;
    }

    .btn:hover {
      background: #7a39a0;
    }

    .back-link {
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }

    .back-link a {
      color: var(--violet);
      font-weight: 600;
    }

    .message {
      margin-top: 1rem;
      font-size: 0.9rem;
      min-height: 1.5em;
    }
  </style>
</head>

<body>
  <div class="reset-container">
    <h2>Forgot your password?</h2>
    <p>Enter your email address and we’ll send you a link to reset your password.</p>
    <input type="email" id="resetEmail" placeholder="name@example.com" autocomplete="email" />
    <button id="sendResetBtn" class="btn">Send reset link</button>
    <div id="message" class="message"></div>
    <div class="back-link"><a href="Feature%202%20-%20Login.html">← Back to login</a></div>
  </div>

  <script>
    document.getElementById('sendResetBtn').addEventListener('click', () => {
      const email = document.getElementById('resetEmail').value.trim();
      const msgDiv = document.getElementById('message');
      if (!email) {
        msgDiv.textContent = 'Please enter your email.';
        msgDiv.style.color = '#e74c3c';
        return;
      }
      const users = JSON.parse(localStorage.getItem('techconnect_users')) || [];
      const user = users.find(u => u.email === email);
      if (user) {
        // Show the actual password (since offline demo)
        msgDiv.textContent = `Your password is: ${user.password}`;
        msgDiv.style.color = '#2ecc71';
      } else {
        msgDiv.textContent = 'No account found with that email address.';
        msgDiv.style.color = '#e74c3c';
      }
    });
  </script>
</body>

</html>
