<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details · TechConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* DDS styles – same as Module 2 */
        :root {
            --deep-gray: #1E1E1E;
            --violet: #8E44AD;
            --violet-dark: #6C3483;
            --soft-white: #EAEAEA;
            --soft-white-muted: #F5F5F5;
            --card-bg: #FFFFFF;
            --border-subtle: #E5E5E5;
            --text-muted: #666666;
            --success: #27AE60;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--soft-white);
            color: var(--deep-gray);
            line-height: 1.5;
        }
        h1, h2, h3, h4 { font-family: 'Syne', sans-serif; }
        .notification-container {
            position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%);
            z-index: 9999; width: 90%; max-width: 400px;
            display: flex; flex-direction: column; gap: 0.5rem;
        }
        .notification {
            padding: 1rem; border-radius: 12px; color: #fff; margin-bottom: 0.5rem;
            animation: slideIn 0.3s forwards;
        }
        .notification.success { background:#2ecc71; }
        .notification.error { background:#e74c3c; }
        .notification.info { background: var(--violet); }
        @keyframes slideIn {
            from { opacity:0; transform:translateY(-30px); }
            to { opacity:1; transform:translateY(0); }
        }
        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 1rem;
        }
        .navbar-brand { font-size: 1.5rem; font-weight: 700; color: var(--violet); text-decoration: none; }
        .navbar-nav { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
        .nav-link { color: var(--text-muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; transition: color 0.2s; }
        .nav-link:hover { color: var(--violet); }
        .dashboard-container { display: flex; min-height: calc(100vh - 65px); }
        .sidebar {
            width: 260px; background-color: var(--card-bg); border-right: 1px solid var(--border-subtle);
            padding: 2rem 1rem;
        }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 0.25rem; }
        .sidebar-menu a {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
            color: var(--text-muted); text-decoration: none; border-radius: 8px; font-size: 0.875rem;
            transition: all 0.2s;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active { background-color: var(--violet); color: white; }
        .main-content { flex: 1; padding: 2rem; max-width: 800px; margin: 0 auto; }
        .job-detail-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            overflow: hidden;
        }
        .job-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        .job-title {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .job-meta {
            display: flex;
            gap: 1.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        .budget-large {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--violet);
        }
        .job-section {
            padding: 2rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .skill-tag {
            background: rgba(142,68,173,0.1);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--violet);
            font-weight: 500;
        }
        .milestones-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .milestone-item {
            background: var(--soft-white-muted);
            padding: 1rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .client-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--soft-white-muted);
            border-radius: 12px;
        }
        .apply-section {
            background: var(--soft-white-muted);
            text-align: center;
            padding: 2rem;
        }
        .btn-apply {
            background: var(--violet);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-apply:hover {
            background: var(--violet-dark);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--violet);
            color: var(--violet);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .job-title { font-size: 1.4rem; }
            .milestone-item { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="notification-container" id="notificationContainer"></div>
    <nav class="navbar">
        <a href="home.html" class="navbar-brand">TechConnect</a>
        <div class="navbar-nav" id="navbarNav"></div>
    </nav>
    <div class="dashboard-container">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="../Module%202/home.html">Home</a></li>
                <li><a href="../Module%202/dashboard.html">Browse Jobs</a></li>
                <li><a href="../Module%202/post-job.html">Post a Job</a></li>
                <li><a href="../Module%201/Feature%203%20-%20Profile.html">My Profile</a></li>
                <li><a href="../Module%202/job-details.html" class="active">Job Details</a></li>
                <li><a href="../Module%203/my-jobs.html">Pending Offers</a></li>
                <li><a href="../Module%203/send-offer.html">Send Offer</a></li>
                <li><a href="../Module%203/submit-milestone.html">Submit Work</a></li>
                <li><a href="../Module%203/review-milestone.html">Review Work</a></li>
                <li><a href="#" id="signOutSidebar">Sign out</a></li>
            </ul>
        </aside>
        <main class="main-content" id="mainContent">
            <div style="text-align: center; padding: 3rem;">Loading job details...</div>
        </main>
    </div>

    <script>
        // ========== HELPER FUNCTIONS ==========
        function showNotification(message, type = 'info', duration = 4000) {
            const container = document.getElementById('notificationContainer');
            if (!container) return;
            const notif = document.createElement('div');
            notif.className = `notification ${type}`;
            notif.textContent = message;
            container.appendChild(notif);
            setTimeout(() => {
                notif.classList.add('hide');
                notif.addEventListener('animationend', () => notif.remove());
            }, duration);
        }

        function getCurrentUser() {
            return JSON.parse(localStorage.getItem('techconnect_current_user'));
        }

        function getJobs() {
            return JSON.parse(localStorage.getItem('techconnect_jobs')) || [];
        }

        function getOffers() {
            return JSON.parse(localStorage.getItem('techconnect_offers')) || [];
        }

        function saveOffers(offers) {
            localStorage.setItem('techconnect_offers', JSON.stringify(offers));
        }

        function getProfile(uid) {
            const profiles = JSON.parse(localStorage.getItem('techconnect_profiles')) || {};
            return profiles[uid] || {};
        }

        function getUsers() {
            return JSON.parse(localStorage.getItem('techconnect_users')) || [];
        }

        function formatCurrency(amount) {
            return amount.toLocaleString() + ' FCFA';
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
        }

        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const half = rating % 1 >= 0.5;
            let stars = '';
            for (let i = 0; i < fullStars; i++) stars += '★';
            if (half) stars += '½';
            for (let i = stars.length; i < 5; i++) stars += '☆';
            return stars;
        }

        // ========== MAIN RENDER ==========
        function loadJobDetails() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = '../Module%201/Feature%202%20-%20Login.html';
                return;
            }

            // Update navbar
            const nav = document.getElementById('navbarNav');
            nav.innerHTML = `
                <a href="home.html" class="nav-link">Home</a>
                <a href="dashboard.html" class="nav-link">Browse</a>
                <a href="post-job.html" class="nav-link">Post Job</a>
                <a href="../Module%201/Feature%203%20-%20Profile.html" class="nav-link">Profile</a>
                <a href="#" class="nav-link" id="signOutLink">Sign out</a>
            `;
            document.getElementById('signOutLink').addEventListener('click', () => {
                localStorage.removeItem('techconnect_current_user');
                window.location.href = '../index.html';
            });
            document.getElementById('signOutSidebar').addEventListener('click', () => {
                localStorage.removeItem('techconnect_current_user');
                window.location.href = '../index.html';
            });

            // Get job ID from URL
            const params = new URLSearchParams(window.location.search);
            const jobId = params.get('id');
            if (!jobId) {
                document.getElementById('mainContent').innerHTML = '<div class="empty-state"><p>No job specified.</p><a href="dashboard.html" class="btn-outline">Back to jobs</a></div>';
                return;
            }

            const jobs = getJobs();
            const job = jobs.find(j => j.id === jobId);
            if (!job) {
                document.getElementById('mainContent').innerHTML = '<div class="empty-state"><p>Job not found.</p><a href="dashboard.html" class="btn-outline">Back to jobs</a></div>';
                return;
            }

            // Get client info
            const clientProfile = getProfile(job.clientId);
            const clientUser = getUsers().find(u => u.uid === job.clientId);
            const clientRating = clientProfile.rating || 0;

            // Check if freelancer has already applied (offer exists)
            const existingOffer = getOffers().find(o => o.jobId === job.id && o.freelancerId === user.uid);
            const hasApplied = existingOffer !== undefined;
            const isOwner = (user.role === 'client' && job.clientId === user.uid);

            // Milestones HTML
            let milestonesHtml = '';
            if (job.milestones && job.milestones.length) {
                milestonesHtml = `
                    <div class="job-section">
                        <div class="section-title">💰 Milestones</div>
                        <div class="milestones-list">
                            ${job.milestones.map((m, idx) => `
                                <div class="milestone-item">
                                    <div><strong>Milestone ${idx+1}:</strong> ${escapeHtml(m.description)}</div>
                                    <div>${formatCurrency(m.amount)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Skills HTML
            const skillsHtml = job.requiredSkills.map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('');

            // Apply button (only for freelancers who haven't applied and job is active)
            let applyHtml = '';
            if (user.role === 'skilled' && job.status === 'active' && !hasApplied && !isOwner) {
                applyHtml = `
                    <div class="apply-section">
                        <button class="btn-apply" id="applyBtn">Apply for this job</button>
                    </div>
                `;
            } else if (user.role === 'skilled' && hasApplied) {
                applyHtml = `<div class="apply-section"><p style="color:var(--violet);">You have already applied for this job. The client will contact you.</p></div>`;
            } else if (user.role === 'client' && isOwner) {
                applyHtml = `<div class="apply-section"><p style="color:var(--text-muted);">This is your posted job.</p></div>`;
            } else if (job.status !== 'active') {
                applyHtml = `<div class="apply-section"><p style="color:var(--text-muted);">This job is no longer accepting applications.</p></div>`;
            }

            const fullHtml = `
                <div class="job-detail-card">
                    <div class="job-header">
                        <h1 class="job-title">${escapeHtml(job.title)}</h1>
                        <div class="job-meta">
                            <span class="meta-item">💰 <strong class="budget-large">${formatCurrency(job.budget)}</strong></span>
                            <span class="meta-item">📅 Deadline: ${formatDate(job.deadline)}</span>
                            <span class="meta-item">📊 Level: ${job.level.charAt(0).toUpperCase() + job.level.slice(1)}</span>
                        </div>
                    </div>
                    <div class="job-section">
                        <div class="section-title">📝 Description</div>
                        <p>${escapeHtml(job.description)}</p>
                    </div>
                    <div class="job-section">
                        <div class="section-title">🔧 Required Skills</div>
                        <div class="skills-list">${skillsHtml}</div>
                    </div>
                    ${milestonesHtml}
                    <div class="job-section">
                        <div class="section-title">👤 Client Information</div>
                        <div class="client-card">
                            <div>
                                <strong>${escapeHtml(clientProfile.name || clientUser?.email || 'Anonymous')}</strong><br>
                                <span style="font-size:0.8rem;">⭐ ${clientRating.toFixed(1)} ${renderStars(clientRating)}</span>
                            </div>
                        </div>
                    </div>
                    ${applyHtml}
                </div>
            `;
            document.getElementById('mainContent').innerHTML = fullHtml;

            // Attach apply button handler
            const applyBtn = document.getElementById('applyBtn');
            if (applyBtn) {
                applyBtn.addEventListener('click', () => {
                    // Create an offer
                    const offers = getOffers();
                    const newOffer = {
                        id: Date.now(),
                        jobId: job.id,
                        jobTitle: job.title,
                        clientId: job.clientId,
                        freelancerId: user.uid,
                        price: job.budget,
                        message: `I would like to work on this job. My skills: ${(getProfile(user.uid).skills || []).join(', ') || 'available upon request'}.`,
                        status: 'pending',
                        createdAt: new Date().toISOString(),
                        expiresAt: new Date(Date.now() + 48 * 60 * 60 * 1000).toISOString()
                    };
                    offers.push(newOffer);
                    saveOffers(offers);
                    showNotification('Application submitted! The client will review your offer.', 'success');
                    // Reload to show "already applied" state
                    setTimeout(() => loadJobDetails(), 1000);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', loadJobDetails);
    </script>
</body>
</html>
