<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Offer · TechConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Same DDS styles as my-jobs.html – reuse */
        :root {
            --deep-gray: #1E1E1E;
            --violet: #8E44AD;
            --violet-light: #A569BD;
            --violet-dark: #6C3483;
            --soft-white: #EAEAEA;
            --soft-white-muted: #F5F5F5;
            --card-bg: #FFFFFF;
            --border-subtle: #E5E5E5;
            --text-muted: #666666;
            --success: #27AE60;
            --error: #E74C3C;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--soft-white);
            color: var(--deep-gray);
            line-height: 1.5;
        }
        h1, h2, h3, h4 { font-family: 'Syne', sans-serif; }
        .notification-container {
            position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%);
            z-index: 9999; width: 90%; max-width: 400px;
            display: flex; flex-direction: column; gap: 0.5rem;
        }
        .notification {
            padding: 1rem 1.2rem; border-radius: 12px; color: #fff;
            font-size: 0.9rem; font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            opacity: 0; transform: translateY(-30px);
            animation: slideIn 0.3s cubic-bezier(0.4,0,0.2,1) forwards;
        }
        .notification.success { background:#2ecc71; }
        .notification.error { background:#e74c3c; }
        .notification.info { background: var(--violet); }
        @keyframes slideIn {
            0% { opacity:0; transform:translateY(-30px); }
            100% { opacity:1; transform:translateY(0); }
        }
        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 1rem;
        }
        .navbar-brand { font-size: 1.5rem; font-weight: 700; color: var(--violet); text-decoration: none; }
        .navbar-nav { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
        .nav-link { color: var(--text-muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; transition: color 0.2s; }
        .nav-link:hover { color: var(--violet); }
        .dashboard-container { display: flex; min-height: calc(100vh - 65px); }
        .sidebar {
            width: 260px; background-color: var(--card-bg); border-right: 1px solid var(--border-subtle);
            padding: 2rem 1rem;
        }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 0.25rem; }
        .sidebar-menu a {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
            color: var(--text-muted); text-decoration: none; border-radius: 8px; font-size: 0.875rem;
            transition: all 0.2s;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active { background-color: var(--violet); color: white; }
        .main-content { flex: 1; padding: 2rem; max-width: 800px; margin: 0 auto; }
        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: var(--soft-white-muted);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.875rem;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--violet);
        }
        .info-box {
            background: var(--soft-white-muted);
            padding: 1rem;
            border-radius: 12px;
            margin: 1rem 0;
        }
        .info-box p {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--violet);
            color: white;
        }
        .btn-primary:hover {
            background: var(--violet-dark);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--deep-gray);
        }
        .btn-outline:hover {
            border-color: var(--violet);
            color: var(--violet);
        }
        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>
    <div class="notification-container" id="notificationContainer"></div>
    <nav class="navbar">
        <a href="home.html" class="navbar-brand">TechConnect</a>
        <div class="navbar-nav" id="navbarNav"></div>
    </nav>
    <div class="dashboard-container">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="../Module%202/home.html">Home</a></li>
                <li><a href="../Module%202/dashboard.html">Browse Jobs</a></li>
                <li><a href="../Module%202/post-job.html">Post a Job</a></li>
                <li><a href="../Module%201/Feature%203%20-%20Profile.html">My Profile</a></li>
                <li><a href="../Module%202/job-details.html">Job Details</a></li>
                <li><a href="../Module%203/my-jobs.html">Pending Offers</a></li>
                <li><a href="send-offer.html" class="active">Send Offer</a></li>
                <li><a href="submit-milestone.html">Submit Work</a></li>
                <li><a href="review-milestone.html">Review Work</a></li>
                <li><a href="#" id="signOutSidebar">Sign out</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="form-card">
                <h2>Send Job Offer</h2>
                <form id="offerForm">
                    <div class="form-group">
                        <label>Select your job</label>
                        <select id="jobSelect" required>
                            <option value="">-- Choose a job you posted --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Freelancer Email</label>
                        <input type="email" id="freelancerEmail" placeholder="Enter freelancer's email" required>
                    </div>
                    <div class="form-group">
                        <label>Offer Amount (FCFA)</label>
                        <input type="number" id="offerPrice" step="100" required>
                    </div>
                    <div class="form-group">
                        <label>Offer Message</label>
                        <textarea id="offerNote" rows="4" placeholder="Describe the terms, timeline, and expectations..." required></textarea>
                    </div>
                    <div class="info-box">
                        <p>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="1" x2="12" y2="23"></line>
                                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                            </svg>
                            <span>Selected job budget: <strong id="budgetDisplay">0</strong> FCFA</span>
                        </p>
                        <p>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            </svg>
                            Funds will be held in escrow via Nkwa Pay.
                        </p>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn btn-primary">Send Offer</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script>
        function showNotification(msg, type) { /* same as before */ }
        function getCurrentUser() { return JSON.parse(localStorage.getItem('techconnect_current_user')); }
        function getJobs() { return JSON.parse(localStorage.getItem('techconnect_jobs')) || []; }
        function getOffers() { return JSON.parse(localStorage.getItem('techconnect_offers')) || []; }
        function saveOffers(offers) { localStorage.setItem('techconnect_offers', JSON.stringify(offers)); }
        function getProfile(uid) { return (JSON.parse(localStorage.getItem('techconnect_profiles')) || {})[uid] || {}; }
        function getUsers() { return JSON.parse(localStorage.getItem('techconnect_users')) || []; }

        function formatCurrency(amt) { return amt.toLocaleString(); }

        function loadJobsForClient() {
            const user = getCurrentUser();
            if (!user || user.role !== 'client') return;
            const jobs = getJobs().filter(j => j.clientId === user.uid && j.status === 'active');
            const select = document.getElementById('jobSelect');
            select.innerHTML = '<option value="">-- Choose a job you posted --</option>';
            jobs.forEach(job => {
                const option = document.createElement('option');
                option.value = job.id;
                option.textContent = `${job.title} (${job.budget.toLocaleString()} FCFA)`;
                option.dataset.budget = job.budget;
                select.appendChild(option);
            });
            if (jobs.length === 0) {
                select.innerHTML = '<option value="">No active jobs. Create one first.</option>';
            }
        }

        document.getElementById('jobSelect').addEventListener('change', function() {
            const selected = this.options[this.selectedIndex];
            const budget = selected.dataset.budget || 0;
            document.getElementById('budgetDisplay').innerText = parseInt(budget).toLocaleString();
            if (budget) document.getElementById('offerPrice').value = budget;
        });

        document.getElementById('offerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = getCurrentUser();
            if (!user || user.role !== 'client') {
                showNotification('Only clients can send offers.', 'error');
                return;
            }
            const jobId = document.getElementById('jobSelect').value;
            if (!jobId) {
                showNotification('Please select a job.', 'error');
                return;
            }
            const jobs = getJobs();
            const job = jobs.find(j => j.id === jobId);
            if (!job) {
                showNotification('Job not found.', 'error');
                return;
            }
            const freelancerEmail = document.getElementById('freelancerEmail').value.trim();
            const price = parseFloat(document.getElementById('offerPrice').value);
            const message = document.getElementById('offerNote').value.trim();
            if (!freelancerEmail || isNaN(price) || price <= 0 || !message) {
                showNotification('Please fill all fields correctly.', 'error');
                return;
            }
            // Find freelancer user by email
            const users = getUsers();
            const freelancer = users.find(u => u.email === freelancerEmail && u.role === 'skilled');
            if (!freelancer) {
                showNotification('No freelancer found with that email.', 'error');
                return;
            }
            // Create offer
            const offers = getOffers();
            const newOffer = {
                id: Date.now(),
                jobId: job.id,
                jobTitle: job.title,
                clientId: user.uid,
                freelancerId: freelancer.uid,
                price: price,
                message: message,
                status: 'pending',
                createdAt: new Date().toISOString(),
                expiresAt: new Date(Date.now() + 48 * 60 * 60 * 1000).toISOString()
            };
            offers.push(newOffer);
            saveOffers(offers);
            showNotification('Offer sent successfully! The freelancer has 48 hours to respond.', 'success');
            document.getElementById('offerForm').reset();
            document.getElementById('budgetDisplay').innerText = '0';
            loadJobsForClient();
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            if (confirm('Clear all fields?')) document.getElementById('offerForm').reset();
        });

        function init() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = '../Module%201/Feature%202%20-%20Login.html';
                return;
            }
            if (user.role !== 'client') {
                document.querySelector('.main-content').innerHTML = '<div class="form-card"><p>Only clients can send offers.</p></div>';
                return;
            }
            const nav = document.getElementById('navbarNav');
            nav.innerHTML = `
                <a href="../Module%202/home.html" class="nav-link">Home</a>
                <a href="../Module%202/dashboard.html" class="nav-link">Browse</a>
                <a href="../Module%202/post-job.html" class="nav-link">Post Job</a>
                <a href="../Module%201/Feature%203%20-%20Profile.html" class="nav-link">Profile</a>
                <a href="#" class="nav-link" id="signOutLink">Sign out</a>
            `;
            document.getElementById('signOutLink').addEventListener('click', () => {
                localStorage.removeItem('techconnect_current_user');
                window.location.href = '../index.html';
            });
            document.getElementById('signOutSidebar').addEventListener('click', () => {
                localStorage.removeItem('techconnect_current_user');
                window.location.href = '../index.html';
            });
            loadJobsForClient();
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
