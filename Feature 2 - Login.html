<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – TechConnect</title>
  <meta name="description" content="Log into your TechConnect account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    /* ========== EXACT login.css ========== */
    :root {
      --deep-gray: #1E1E1E;
      --violet: #8E44AD;
      --soft-white: #EAEAEA;
      --transition: 0.3s ease;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--soft-white);
      color: var(--deep-gray);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .notification-container {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .notification {
      padding: 1rem 1.2rem;
      border-radius: 12px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: translateY(-30px);
      animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .notification.success {
      background: #2ecc71;
      border-left: 4px solid #27ae60;
    }

    .notification.error {
      background: #e74c3c;
      border-left: 4px solid #c0392b;
    }

    .notification.info {
      background: var(--violet);
      border-left: 4px solid #6a2f82;
    }

    .notification.hide {
      animation: fadeOut 0.3s ease forwards;
    }

    @keyframes slideIn {
      0% {
        opacity: 0;
        transform: translateY(-30px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeOut {
      0% {
        opacity: 1;
        transform: translateY(0);
      }

      100% {
        opacity: 0;
        transform: translateY(-20px);
      }
    }

    .auth-container {
      width: 100%;
      max-width: 860px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      min-height: 520px;
    }

    .split-wrapper {
      display: flex;
      min-height: 440px;
    }

    .form-side {
      width: 55%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2.5rem 2.5rem;
      background: #fff;
    }

    .illustration-side {
      width: 45%;
      background: linear-gradient(135deg, var(--deep-gray) 0%, #2d1b4a 100%);
      color: var(--soft-white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .form-content {
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
    }

    .back-link {
      margin-bottom: 1.5rem;
    }

    .back-link a {
      font-size: 0.85rem;
      color: #777;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: color var(--transition);
    }

    .back-link a:hover {
      color: var(--violet);
    }

    h2 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .form-sub {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 2rem;
    }

    .field {
      margin-bottom: 1.2rem;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--deep-gray);
    }

    .field input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color var(--transition);
    }

    .field input:focus {
      outline: none;
      border-color: var(--violet);
      box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.15);
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #777;
      cursor: pointer;
    }

    .toggle-password:hover {
      color: var(--violet);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .remember {
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: #666;
    }

    .forgot {
      font-size: 0.85rem;
      color: var(--violet);
      font-weight: 500;
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.9rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all var(--transition);
    }

    .btn--accent {
      background: var(--violet);
      color: #fff;
      border-color: var(--violet);
    }

    .btn--accent:hover {
      background: #7a39a0;
      box-shadow: 0 8px 20px rgba(142, 68, 173, 0.3);
    }

    .btn--outline {
      background: transparent;
      color: var(--deep-gray);
      border: 1px solid #ccc;
    }

    .btn--outline:hover {
      border-color: var(--violet);
      color: var(--violet);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: #aaa;
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .illustration-content {
      text-align: center;
    }

    .illustration-content h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      margin: 1.5rem 0 1rem;
    }

    .illustration-content p {
      font-size: 0.9rem;
      line-height: 1.7;
      color: #ccc;
      max-width: 260px;
      margin: 0 auto;
    }

    .auth-footer {
      text-align: center;
      padding: 1.5rem;
      border-top: 1px solid #eee;
      font-size: 0.85rem;
    }

    .auth-footer a {
      color: var(--violet);
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .auth-container {
        min-height: auto;
      }

      .split-wrapper {
        flex-direction: column-reverse;
        min-height: auto;
      }

      .form-side,
      .illustration-side {
        width: 100%;
      }

      .form-side {
        padding: 2rem 1.5rem;
      }

      .illustration-side {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="notification-container" id="notificationContainer"></div>

  <div class="auth-container">
    <div class="split-wrapper">
      <div class="form-side">
        <div class="form-content">
          <div class="back-link">
            <a href="../index.html">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
              Back home
            </a>
          </div>
          <h2>Welcome back</h2>
          <p class="form-sub">Please enter your details to sign in.</p>

          <form id="loginForm" novalidate>
            <div class="field">
              <label for="loginEmail">Email address</label>
              <input type="email" id="loginEmail" placeholder="name@example.com" required autocomplete="email" />
            </div>
            <div class="field">
              <label for="loginPassword">Password</label>
              <div class="password-wrapper">
                <input type="password" id="loginPassword" placeholder="Enter your password" required
                  autocomplete="current-password" />
                <button type="button" class="toggle-password" aria-label="Show password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>
            <div class="options">
              <label class="remember"><input type="checkbox" /> Remember for 30 days</label>
              <a href="Feature%204%20-%20Reset%20Password.html" class="forgot">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn--accent" id="loginBtn">
              <span class="btn-text">Sign in</span>
              <span class="spinner" hidden></span>
            </button>
            <div class="divider"><span>or</span></div>
            <button type="button" class="btn btn--outline" id="googleLoginBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path
                  d="M18.2 3.8C16.6 2.4 14.5 1.5 12 1.5 6.5 1.5 2 6 2 11.5S6.5 21.5 12 21.5c2.9 0 5.5-1.1 7.5-3.1l-2.9-2.2c-.8.7-1.9 1.1-3.1 1.1-2.5 0-4.5-2-4.5-4.5s2-4.5 4.5-4.5c1.2 0 2.4.5 3.3 1.4l-1.3 1.3h4.1V6.2c-1.2-1-2.6-2.4-4.4-2.4z" />
              </svg>
              Sign in with Google
            </button>
          </form>
        </div>
      </div>

      <div class="illustration-side">
        <div class="illustration-content">
          <svg width="200" height="180" viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true">
            <circle cx="100" cy="100" r="70" fill="none" stroke="var(--violet)" stroke-width="2"
              stroke-dasharray="8 8" />
            <rect x="85" y="70" width="30" height="40" rx="8" fill="var(--soft-white)" opacity="0.9" />
            <circle cx="100" cy="80" r="5" fill="var(--violet)" />
            <path d="M95 100 L105 100 M95 105 L105 105" stroke="var(--violet)" stroke-width="2"
              stroke-linecap="round" />
            <path d="M130 80 Q140 60 155 65" stroke="var(--soft-white)" stroke-width="2" stroke-linecap="round" />
            <circle cx="160" cy="65" r="6" fill="var(--violet)" />
            <path d="M70 120 Q50 130 45 115" stroke="var(--soft-white)" stroke-width="2" stroke-linecap="round" />
            <circle cx="40" cy="115" r="6" fill="var(--violet)" />
            <circle cx="60" cy="80" r="4" fill="var(--soft-white)" />
            <circle cx="140" cy="110" r="4" fill="var(--soft-white)" />
          </svg>
          <h1>Your workspace awaits</h1>
          <p>Manage projects, track milestones, and communicate securely.</p>
        </div>
      </div>
    </div>

    <p class="auth-footer">
      Don't have an account? <a href="Feature%201%20-%20Register.html">Sign up</a>
    </p>
  </div>

  <script>
    // Define admin credentials
    const ADMIN_EMAIL = "Admin01@gmail.com";
    const ADMIN_PASSWORD = "Admin001";

    function showNotification(message, type = 'info', duration = 4000) {
      const container = document.getElementById('notificationContainer');
      if (!container) return;
      const notif = document.createElement('div');
      notif.className = `notification ${type}`;
      notif.textContent = message;
      container.appendChild(notif);
      setTimeout(() => {
        notif.classList.add('hide');
        notif.addEventListener('animationend', () => notif.remove());
      }, duration);
    }

    // Password toggle
    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
        input.setAttribute('type', type);
      });
    });

    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const googleBtn = document.getElementById('googleLoginBtn');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showNotification('Please enter your email and password.', 'error');
        return;
      }

      // Check for admin credentials first
      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
        const adminUser = {
          uid: 'admin_uid',
          email: ADMIN_EMAIL,
          role: 'admin',
          isAdmin: true
        };
        localStorage.setItem('techconnect_current_user', JSON.stringify(adminUser));
        showNotification('Admin login successful!', 'success');
        setTimeout(() => window.location.href = '../Module%205/admin.html', 1000);
        return;
      }

      // Simulate loading
      loginBtn.disabled = true;
      const btnText = loginBtn.querySelector('.btn-text');
      const spinner = loginBtn.querySelector('.spinner');
      if (btnText) btnText.style.display = 'none';
      if (spinner) spinner.hidden = false;

      setTimeout(() => {
        const users = JSON.parse(localStorage.getItem('techconnect_users')) || [];
        const user = users.find(u => u.email === email && u.password === password);

        if (user) {
          if (user.suspended === true) {
            showNotification('Your account has been suspended. Contact admin.', 'error');
            loginBtn.disabled = false;
            btnText.style.display = '';
            spinner.hidden = true;
            return;
          }
          localStorage.setItem('techconnect_current_user', JSON.stringify({
            uid: user.uid,
            email: user.email,
            role: user.role
          }));
          showNotification('Login successful!', 'success');
          setTimeout(() => window.location.href = '../Module%202/home.html', 1000);
        } else {
          showNotification('Invalid email or password.', 'error');
          loginBtn.disabled = false;
          if (btnText) btnText.style.display = '';
          if (spinner) spinner.hidden = true;
        }
      }, 500);
    });

    googleBtn.addEventListener('click', () => {
      showNotification('Google sign-in simulated. Please use email/password.', 'info');
    });
  </script>
</body>

</html>
