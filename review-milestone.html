<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Milestone · TechConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        /* Same DDS styles – reused */
        :root {
            --deep-gray: #1E1E1E;
            --violet: #8E44AD;
            --violet-dark: #6C3483;
            --soft-white: #EAEAEA;
            --soft-white-muted: #F5F5F5;
            --card-bg: #FFFFFF;
            --border-subtle: #E5E5E5;
            --text-muted: #666666;
            --warning: #F39C12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--soft-white);
            color: var(--deep-gray);
            line-height: 1.5;
        }

        h1,
        h2,
        h3 {
            font-family: 'Syne', sans-serif;
        }

        .notification-container {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 400px;
        }

        .notification {
            padding: 1rem;
            border-radius: 12px;
            color: #fff;
            margin-bottom: 0.5rem;
            animation: slideIn 0.3s forwards;
        }

        .notification.success {
            background: #2ecc71;
        }

        .notification.error {
            background: #e74c3c;
        }

        .notification.info {
            background: var(--violet);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--violet);
            text-decoration: none;
        }

        .navbar-nav {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--violet);
        }

        .dashboard-container {
            display: flex;
            min-height: calc(100vh - 65px);
        }

        .sidebar {
            width: 260px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-subtle);
            padding: 2rem 1rem;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 0.25rem;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background-color: var(--violet);
            color: white;
        }

        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .submission-card {
            background: var(--soft-white-muted);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .revision-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="notification-container" id="notificationContainer"></div>
    <nav class="navbar"><a href="../Module%202/home.html" class="navbar-brand">TechConnect</a>
        <div class="navbar-nav" id="navbarNav"></div>
    </nav>
    <div class="dashboard-container">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="../Module%202/home.html">Home</a></li>
                <li><a href="../Module%202/dashboard.html">Browse Jobs</a></li>
                <li><a href="../Module%202/post-job.html">Post a Job</a></li>
                <li><a href="../Module%201/Feature%203%20-%20Profile.html">My Profile</a></li>
                <li><a href="../Module%202/job-details.html">Job Details</a></li>
                <li><a href="../Module%203/my-jobs.html">Pending Offers</a></li>
                <li><a href="send-offer.html">Send Offer</a></li>
                <li><a href="submit-milestone.html">Submit Work</a></li>
                <li><a href="review-milestone.html" class="active">Review Work</a></li>
                <li><a href="#" id="signOutSidebar">Sign out</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="form-card">
                <h2>Review Milestone Submissions</h2>
                <div id="submissionsList"></div>
            </div>
        </main>
    </div>
    <script>
        // Helper functions
        function showNotification(msg, type) { /* same */ }
        function getCurrentUser() { return JSON.parse(localStorage.getItem('techconnect_current_user')); }
        function getJobs() { return JSON.parse(localStorage.getItem('techconnect_jobs')) || []; }
        function getSubmissions() { return JSON.parse(localStorage.getItem('techconnect_milestone_submissions')) || []; }
        function saveSubmissions(sub) { localStorage.setItem('techconnect_milestone_submissions', JSON.stringify(sub)); }

        function loadPendingSubmissions() {
            const user = getCurrentUser();
            if (!user || user.role !== 'client') return;
            const jobs = getJobs().filter(j => j.clientId === user.uid);
            const jobIds = jobs.map(j => j.id);
            const submissions = getSubmissions().filter(s => jobIds.includes(s.jobId) && s.status === 'pending');
            const container = document.getElementById('submissionsList');
            if (submissions.length === 0) {
                container.innerHTML = '<p>No pending milestone submissions.</p>';
                return;
            }
            container.innerHTML = submissions.map(sub => {
                const job = jobs.find(j => j.id === sub.jobId);
                return `
                    <div class="submission-card" data-id="${sub.id}">
                        <h4>${escapeHtml(job?.title || 'Job')} – Milestone ${sub.milestoneIndex + 1}</h4>
                        <p><strong>Description:</strong> ${escapeHtml(sub.description)}</p>
                        <p><strong>Amount:</strong> ${sub.amount.toLocaleString()} FCFA</p>
                        <div class="revision-info">Revision attempts: ${sub.revisionCount || 0}/3</div>
                        <div class="form-group">
                            <label>Comment (required for changes)</label>
                            <textarea class="comment-input" data-id="${sub.id}" rows="2" placeholder="Your feedback..."></textarea>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-success" onclick="reviewSubmission(${sub.id}, 'approve')">Approve</button>
                            <button class="btn btn-warning" onclick="reviewSubmission(${sub.id}, 'changes')">Request Changes</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.reviewSubmission = function (subId, action) {
            const submissions = getSubmissions();
            const subIndex = submissions.findIndex(s => s.id === subId);
            if (subIndex === -1) return;
            const sub = submissions[subIndex];
            const jobs = getJobs();
            const job = jobs.find(j => j.id === sub.jobId);
            if (job && job.disputed === true) {
                showNotification('This job is under dispute. Milestone approval is frozen. Contact admin.', 'error');
                return;
            }
            const commentInput = document.querySelector(`.comment-input[data-id="${subId}"]`);
            const comment = commentInput ? commentInput.value.trim() : '';
            if (action === 'changes' && !comment) {
                showNotification('Comment is mandatory when requesting changes.', 'error');
                return;
            }
            if (action === 'changes') {
                let revCount = (sub.revisionCount || 0) + 1;
                if (revCount > 3) {
                    showNotification('Revision limit reached (3/3). Please contact admin.', 'error');
                    return;
                }
                sub.status = 'revision_requested';
                sub.revisionCount = revCount;
                sub.feedback = comment;
                showNotification(`Changes requested (${revCount}/3). Freelancer will resubmit.`, 'info');
            } else if (action === 'approve') {
                sub.status = 'approved';
                sub.approvedAt = new Date().toISOString();
                const commission = sub.amount * 0.1;
                const netAmount = sub.amount - commission;
                // Record disbursement (payment release)
                let disbursements = JSON.parse(localStorage.getItem('techconnect_disbursements')) || [];
                disbursements.push({
                    jobId: sub.jobId,
                    milestoneIndex: sub.milestoneIndex,
                    amount: sub.amount,
                    commission: commission,
                    netAmount: netAmount,
                    timestamp: new Date().toISOString()
                });
                localStorage.setItem('techconnect_disbursements', JSON.stringify(disbursements));
                showNotification(`Milestone approved! Payment of ${netAmount.toLocaleString()} FCFA (after 10% commission) released to freelancer.`, 'success');
                // Update job if all milestones approved
                if (job) {
                    const allSubmissions = getSubmissions().filter(s => s.jobId === sub.jobId);
                    const approvedCount = allSubmissions.filter(s => s.status === 'approved').length;
                    if (approvedCount === job.milestones.length) {
                        job.status = 'completed';
                        saveJobs(jobs);
                        showNotification('All milestones completed! Job marked as completed.', 'success');
                    }
                }
            }
            saveSubmissions(submissions);
            loadPendingSubmissions();
        };

        function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])) || ''; }
        function saveJobs(jobs) { localStorage.setItem('techconnect_jobs', JSON.stringify(jobs)); }

        function init() {
            const user = getCurrentUser();
            if (!user) { window.location.href = '../Module%201/Feature%202%20-%20Login.html'; return; }
            if (user.role !== 'client') { document.querySelector('.main-content').innerHTML = '<div class="form-card"><p>Only clients can review milestone submissions.</p></div>'; return; }
            // navbar setup omitted for brevity – same as before
            loadPendingSubmissions();
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
